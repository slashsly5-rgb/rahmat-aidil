<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip" href="#career">Skip to content</a>

  <header class="hero" id="top">
    <div class="hero__media">
      <video class="hero__video" muted loop playsinline preload="none" poster="media/hero-poster.jpg" aria-hidden="true"></video>
      <div class="hero__shade"></div>
      <div class="hero__orbit">
        <video class="hero__orbit-video" muted loop playsinline preload="none" poster="media/astro-poster.jpg" aria-hidden="true"></video>
        <ul class="hero__cards" aria-label="Recognition"></ul>
      </div>
    </div>
    <div class="hero__content">
      <h1 class="hero__title" data-bind="headline"></h1>
      <div class="hero__ctas">
        <a class="btn btn--primary" href="#projects">See my work</a>
        <a class="btn btn--ghost" data-bind-href="cv" download>Download Profile</a>
      </div>
    </div>
    <svg class="hero__wave" viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="wave-line" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#19e39b"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/>
        </linearGradient>
        <filter id="wave-glow" x="-5%" y="-200%" width="110%" height="500%">
          <feGaussianBlur stdDeviation="3"/>
        </filter>
      </defs>
      <path class="hero__wave-fill" d="M0,64 C220,18 430,18 640,50 C860,84 1120,88 1440,28 L1440,100 L0,100 Z"/>
      <path class="hero__wave-line hero__wave-line--glow" d="M0,64 C220,18 430,18 640,50 C860,84 1120,88 1440,28"/>
      <path class="hero__wave-line" d="M0,64 C220,18 430,18 640,50 C860,84 1120,88 1440,28"/>
    </svg>
  </header>
  <div class="side side--l" aria-hidden="true"></div>
  <div class="side side--r" aria-hidden="true"></div>

  <nav class="nav glass" id="nav" aria-label="Sections"></nav>

  <main class="dash">
    <section class="section" id="career" aria-labelledby="career-h"></section>
    <section class="section" id="projects" aria-labelledby="projects-h"></section>
    <section class="section" id="academic" aria-labelledby="academic-h"></section>
    <section class="section" id="credentials" aria-labelledby="credentials-h"></section>
  </main>
  <footer class="section footer" id="contact"></footer>

  <script src="data/credentials.js"></script>
  <script src="data/training.js"></script>

  <script src="js/app.js"></script>
